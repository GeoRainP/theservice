<style>
:root{
  --brand:#E60023;
  --bg:#fff; --panel:#fff; --fg:#202124; --link:#1a0dab; --visited:#681da8;
  --url:#006621; --muted:#70757a; --rule:#dadce0; --snippet:#4d5156;
  --font:Arial,Helvetica,sans-serif; --size:14px;
}
body[data-era="1998"]{--bg:#fff;--fg:#000;--link:#0000cc;--url:#008000;--muted:#6f6f6f;--rule:#d9d9d9;--snippet:#000;--size:13px}
body[data-era="1993"]{--bg:#c0c0c0;--panel:#c0c0c0;--fg:#000;--link:#0000ee;--url:#008000;--muted:#444;--rule:#808080;--snippet:#000;--font:"Times New Roman",Times,serif;--size:15px}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--size);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:visited{color:var(--visited)}
a:hover{text-decoration:underline}
button,input,select{font-family:inherit}
.icon{width:20px;height:20px;fill:currentColor;display:block}


/* ---------- official brand artwork (1:1) ---------- */
.logo-box{display:flex;align-items:center;justify-content:center}
.glogo{display:none;color:var(--brand)}
body[data-era="2025"] .glogo{display:block}
body[data-era="2025"] .logo{display:none}
.glogo.big{width:272px;height:92px;margin:0 0 26px}
.glogo.small{width:92px;height:31px}
.favicon{position:relative;overflow:hidden}
.fav-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%;padding:5px}
.trail .icon{cursor:pointer;color:#9aa0a6}
.trail .icon:hover{color:var(--brand)}
body[data-era="2025"] .trail .icon{color:var(--brand)}
.ov-spark{color:var(--brand)}
/* ---------- logo ---------- */
.logo{font-weight:500;line-height:1;letter-spacing:-5px;white-space:nowrap;user-select:none;font-family:Arial,Helvetica,sans-serif}
.logo span{color:var(--brand)}
.logo.big{font-size:92px;margin:0 0 26px}
.logo.small{font-size:30px;letter-spacing:-2px}
.logo .sup{display:none}
body[data-era="1998"] .logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;text-shadow:2px 2px 1px #c7c7c7;letter-spacing:-4px}
body[data-era="1998"] .logo .sup{display:inline;font:11px Arial,sans-serif;letter-spacing:0;color:#cc0000;vertical-align:top;text-shadow:none;margin-left:5px;position:relative;top:4px}
body[data-era="1993"] .logo{font-family:"Times New Roman",serif;filter:brightness(0);text-shadow:none;letter-spacing:-2px}
body[data-era="1993"] .logo.big{font-size:82px}
body[data-era="1993"] .logo.small{font-size:40px}

/* ---------- 2025 home ---------- */
#home-nav{position:absolute;top:20px;right:22px;display:flex;align-items:center;gap:18px;font-size:13px;color:#202124}
#home-nav [data-action]{cursor:pointer}
#home-nav [data-action]:hover{text-decoration:underline}
#home-nav .nav-icon{color:#5f6368}
#home-nav .avatar{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;cursor:pointer}
#home-nav .avatar:hover{text-decoration:none}
.view{flex:1 0 auto}
#home{display:flex;flex-direction:column;align-items:center;padding:172px 16px 60px;text-align:center}
.tagline{display:none}
.search-wrap{position:relative;display:flex;align-items:center;width:584px;max-width:88vw;height:46px;background:#fff;border:1px solid #dfe1e5;border-radius:24px;padding:0 14px}
.search-wrap:hover,.search-wrap:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:rgba(223,225,229,0)}
.search-wrap .lead{color:#9aa0a6;margin-right:12px;flex-shrink:0}
.search-wrap .trail{display:flex;align-items:center;gap:14px;color:#5f6368;flex-shrink:0}
.search-wrap .trail .icon{width:20px;height:20px}
.sbox{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:#202124;height:100%}
.btnrow{display:flex;gap:12px;justify-content:center;margin-top:28px}
.gbtn{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;padding:9px 18px;cursor:pointer}
.gbtn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.gbtn.sm{font-size:12px;padding:5px 14px}
.specials{margin-top:28px;font-size:13px;color:#4d5156}
.specials .lbl{font-weight:600}
.specials a{margin:0 2px}
.tips{margin-top:14px;font-size:12px;color:#9aa0a6}
.mosaic-only{display:none}
body[data-era="2025"] .specials,body[data-era="2025"] .tips{display:none}
hr.rule{border:0;border-top:1px solid #bdbdbd;height:0;margin:18px 0}

/* ---------- 1998 / 1993 home ---------- */
body[data-era="1998"] #home-nav,body[data-era="1993"] #home-nav{display:none}
body[data-era="1998"] #home,body[data-era="1993"] #home{padding-top:96px}
body[data-era="1998"] .tagline,body[data-era="1993"] .tagline{display:block;font-size:13px;margin:0 0 9px}
body[data-era="1998"] .search-wrap,body[data-era="1993"] .search-wrap{width:460px;height:24px;border:1px solid #7b7b7b;border-radius:0;padding:0 4px;box-shadow:none;background:#fff}
body[data-era="1998"] .search-wrap:hover,body[data-era="1998"] .search-wrap:focus-within,
body[data-era="1993"] .search-wrap:hover,body[data-era="1993"] .search-wrap:focus-within{box-shadow:none;border-color:#7b7b7b}
body[data-era="1998"] .search-wrap:focus-within,body[data-era="1993"] .search-wrap:focus-within{border-color:#3366cc}
.search-wrap .lead,.search-wrap .trail{display:none}
body[data-era="1998"] #res-head .search-wrap .trail,body[data-era="1993"] #res-head .search-wrap .trail{display:none}
body[data-era="2025"] .search-wrap .lead{display:block}
body[data-era="2025"] .search-wrap .trail{display:flex}
body[data-era="1998"] .sbox,body[data-era="1993"] .sbox{font-size:13px}
body[data-era="1998"] .btnrow,body[data-era="1993"] .btnrow{margin-top:9px;gap:8px}
body[data-era="1998"] .gbtn,body[data-era="1993"] .gbtn{background:#dedede;border:1px solid #858585;border-top-color:#fff;border-left-color:#fff;border-radius:0;font-size:12px;padding:3px 10px;min-width:110px}
body[data-era="1998"] .gbtn:hover,body[data-era="1993"] .gbtn:hover{border-color:#858585;box-shadow:none}
body[data-era="1993"] .search-wrap{border:2px inset #e8e8e8;height:30px}
body[data-era="1993"] .sbox{font-family:"Times New Roman",serif;font-size:16px}
body[data-era="1993"] .gbtn{background:#c0c0c0;border:2px outset #e8e8e8;font-family:"Times New Roman",serif;font-size:15px;padding:2px 12px}
body[data-era="1993"] .mosaic-only{display:block}
body[data-era="1993"] hr.rule{border-top:2px groove #e8e8e8;width:82%}
body[data-era="1993"] .specials,body[data-era="1993"] .tips{font-size:14px;color:#000}
body[data-era="1998"] .specials,body[data-era="1998"] .tips{font-size:11px}

/* ---------- footer ---------- */
.footbar{flex-shrink:0;background:#f2f2f2;border-top:1px solid #dadce0;color:#70757a;font-size:13px;padding:0 20px}
.footbar .frow{padding:14px 12px;display:flex;gap:26px;flex-wrap:wrap}
.footbar .frow + .frow{border-top:1px solid #dadce0}
.footbar [data-action]{cursor:pointer}
.footbar [data-action]:hover{text-decoration:underline;color:#202124}
body[data-era="1998"] .footbar,body[data-era="1993"] .footbar{display:block;text-align:center;background:#efefef;border-top:1px solid #d5d5d5;padding:11px 12px 13px;font-size:11px;line-height:1.9}
body[data-era="1998"] .footbar .frow,body[data-era="1993"] .footbar .frow{display:block;padding:0;border:0}
body[data-era="1998"] .footbar .frow + .frow,body[data-era="1993"] .footbar .frow + .frow{border:0}
body[data-era="1998"] .footbar a,body[data-era="1993"] .footbar a{text-decoration:underline;margin:0 5px}
body[data-era="1993"] .footbar{background:#c0c0c0;border-top:2px groove #e8e8e8;font-size:14px;color:#000}

/* ---------- results header ---------- */
#res-head{display:flex;align-items:center;gap:28px;padding:18px 28px 18px 72px;border-bottom:1px solid #ebebeb;position:sticky;top:0;background:#fff;z-index:5}
#res-head .logo-cell{flex-shrink:0}
#res-head .search-wrap{width:660px;max-width:58vw;height:44px;border-radius:24px;border-color:#dfe1e5}
#res-head .search-wrap .trail{display:flex;color:#4285f4}
#res-head .search-wrap .lead{display:none}
#res-head .res-right{margin-left:auto;display:flex;align-items:center;gap:18px;color:#5f6368}
#res-head .avatar{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500}
#res-head .navlinks,#res-head .res-submit{display:none}
body[data-era="1998"] #res-head,body[data-era="1993"] #res-head{position:static;align-items:flex-end;gap:20px;padding:13px 18px 11px 60px;border-bottom:1px solid var(--rule)}
body[data-era="1998"] #res-head .search-wrap,body[data-era="1993"] #res-head .search-wrap{width:320px;max-width:52vw;height:24px;border-radius:0;border:1px solid #7b7b7b}
body[data-era="1993"] #res-head .search-wrap{border:2px inset #e8e8e8;height:30px}
body[data-era="1998"] #res-head .res-right,body[data-era="1993"] #res-head .res-right{display:none}
body[data-era="1998"] #res-head .navlinks,body[data-era="1993"] #res-head .navlinks{display:block;margin-left:auto;font-size:11px;white-space:nowrap;padding-bottom:3px}
body[data-era="1998"] #res-head .res-submit,body[data-era="1993"] #res-head .res-submit{display:block}

/* ---------- stat / overview / results ---------- */
.stat{padding:14px 28px 6px;font-size:12px;color:var(--muted);margin-left:140px}
.stat b{color:var(--fg);font-weight:normal}
body[data-era="1998"] .stat,body[data-era="1993"] .stat{margin-left:0;padding:11px 18px 9px;font-size:12px}
body[data-era="1993"] .stat{font-size:15px}
#results-list{padding:8px 28px 20px 168px;max-width:900px}
body[data-era="1998"] #results-list,body[data-era="1993"] #results-list{padding:0 18px 18px;max-width:820px}

.overview{margin:8px 28px 26px 168px;max-width:652px;background:linear-gradient(135deg,#f7faff 0%,#f2f7ff 45%,#fdf6ff 100%);border:1px solid #e3ebfb;border-radius:16px;padding:18px 22px 20px}
.ov-head{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;color:#3c4043;margin-bottom:10px}
.ov-head .icon{width:20px;height:20px;color:#4285f4}
.ov-body{font-size:14px;line-height:1.7;color:#3c4043}
.ov-body .a-p{margin:0 0 7px}
.ov-body .a-gap{height:4px}
.ov-body .a-li{margin:0 0 3px 16px;text-indent:-11px}
.ov-body .a-li::before{content:"· ";font-weight:bold}
.caret{display:inline-block;width:7px;height:14px;background:currentColor;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.loading{color:var(--muted)}
body[data-era="1998"] .overview,body[data-era="1993"] .overview{margin:6px 18px 20px;max-width:680px;background:#f7f7f7;border:1px solid #d9d9d9;border-radius:0;padding:10px 12px}
body[data-era="1998"] .ov-head,body[data-era="1993"] .ov-head{font-size:13px;font-weight:normal;margin-bottom:6px}
body[data-era="1998"] .ov-head .icon,body[data-era="1993"] .ov-head .icon{display:none}
body[data-era="1998"] .ov-body,body[data-era="1993"] .ov-body{font-size:13px;line-height:1.45;color:#000}
body[data-era="1993"] .overview{background:#c0c0c0;border:2px groove #e8e8e8}
body[data-era="1993"] .ov-body{font-size:15px}

.hit{margin:0 0 28px;max-width:652px;line-height:1.58}
.hit-site{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.favicon{width:28px;height:28px;border-radius:50%;border:1px solid #ecedef;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.site-meta{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.site-name{font-size:14px;color:#202124}
.site-url{font-size:12px;color:#4d5156;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit-title{display:block;font-size:20px;line-height:1.3;color:var(--link);margin:0 0 3px;padding-top:4px}
.hit-snippet{font-size:14px;color:var(--snippet);line-height:1.58}
.hit-url-classic{display:none}
body[data-era="1998"] .hit,body[data-era="1993"] .hit{margin-bottom:18px;max-width:680px;line-height:1.45}
body[data-era="1998"] .hit-site,body[data-era="1993"] .hit-site{display:none}
body[data-era="1998"] .hit-title,body[data-era="1993"] .hit-title{font-size:15px;padding:0;margin:0;text-decoration:underline}
body[data-era="1998"] .hit-url-classic,body[data-era="1993"] .hit-url-classic{display:block;font-size:12px;color:var(--url)}
body[data-era="1998"] .hit-snippet,body[data-era="1993"] .hit-snippet{font-size:13px;color:var(--snippet)}
body[data-era="1993"] .hit-title{font-size:16px}
body[data-era="1993"] .hit-snippet{font-size:15px}

.related{padding:6px 28px 34px 168px;max-width:900px}
.related h3{font-size:18px;font-weight:400;margin:0 0 14px;color:#202124}
.related-list{display:flex;flex-wrap:wrap;gap:10px;max-width:660px}
.chip{border:1px solid #dadce0;border-radius:20px;padding:9px 16px;font-size:14px;color:#3c4043;background:#fff}
.chip:hover{background:#f8f9fa;text-decoration:none}
body[data-era="1998"] .related,body[data-era="1993"] .related{padding:12px 18px 24px;max-width:820px;border-top:1px solid var(--rule)}
body[data-era="1998"] .related h3,body[data-era="1993"] .related h3{font-size:14px;font-weight:normal;margin-bottom:8px}
body[data-era="1998"] .related-list,body[data-era="1993"] .related-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px}
body[data-era="1998"] .chip,body[data-era="1993"] .chip{border:0;border-radius:0;background:none;padding:2px 0;color:var(--link);text-decoration:underline;font-size:13px}
body[data-era="1998"] .chip:hover,body[data-era="1993"] .chip:hover{background:none}
body[data-era="1993"] .related h3,body[data-era="1993"] .chip{font-size:15px}
#res-bottom{padding:0 28px 30px 168px;font-size:12px;color:var(--muted);max-width:900px}
body[data-era="1998"] #res-bottom,body[data-era="1993"] #res-bottom{padding:4px 18px 22px}
.errorbox{border:1px solid #d93025;background:#fff7f7;padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.6;max-width:652px}
.errorbox .eh{font-weight:600;color:#d93025;margin-bottom:6px}
.errorbox .detail{color:#5f6368;word-break:break-word;font-size:12px;margin:6px 0 10px}
body[data-era="1998"] .errorbox,body[data-era="1993"] .errorbox{border-radius:0}

/* ---------- modal ---------- */
#modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#modal{background:#fff;width:min(560px,94vw);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.24);max-height:90vh;display:flex;flex-direction:column}
.modal-bar{padding:16px 22px 10px;font-size:18px;font-weight:500;color:#202124}
.modal-body{padding:6px 22px 12px;font-size:13px;line-height:1.65;color:#3c4043;overflow:auto}
.modal-body p{margin:0 0 10px}
.modal-body label{display:block;margin:11px 0}
.modal-body .lbl{display:block;font-size:12px;color:#5f6368;margin-bottom:4px}
.modal-body input[type=text],.modal-body input[type=number],.modal-body input[type=password],.modal-body select{width:100%;border:1px solid #dadce0;border-radius:6px;padding:8px 10px;font-size:14px;color:#202124;background:#fff}
.modal-body input[type=number]{width:90px}
.modal-body code{background:#f1f3f4;padding:1px 5px;border-radius:3px;font-family:Consolas,"Courier New",monospace;font-size:12px}
.modal-body .k{font-weight:600;color:#202124}
.modal-body .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.modal-body p.err{color:#c5221f;margin:8px 0 0}
.modal-body p.note{color:#5f6368;margin:8px 0 0}
.modal-body details{margin-top:14px;border-top:1px solid #ebebeb;padding-top:12px}
.modal-body summary{cursor:pointer;color:#1a73e8;font-size:13px}
.modal-body pre{background:#f8f9fa;border:1px solid #ebebeb;border-radius:6px;padding:10px;overflow:auto;font-size:11px;line-height:1.45;max-height:220px;color:#3c4043;white-space:pre-wrap;word-break:break-all}
.modal-foot{padding:12px 22px 20px;display:flex;gap:9px;flex-wrap:wrap}
.modal-foot .gbtn{border-color:#dadce0;background:#fff}
.modal-foot .primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
body[data-era="1998"] #modal,body[data-era="1993"] #modal{border:2px outset #cfcfcf;border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.22)}
body[data-era="1998"] .modal-bar,body[data-era="1993"] .modal-bar{background:#000080;color:#fff;font:bold 12px Arial,sans-serif;padding:5px 9px}
body[data-era="1998"] .modal-body,body[data-era="1993"] .modal-body{font-size:13px}
body[data-era="1993"] #modal{background:#c0c0c0}

@media (max-width:760px){
  .logo.big{font-size:62px}
  #res-head{flex-wrap:wrap;gap:12px;padding:12px 16px}
  #res-head .search-wrap{width:100%;max-width:100%;order:3}
  .stat,.overview,#results-list,.related,#res-bottom{margin-left:0;padding-left:16px;padding-right:16px}
  .overview{margin-left:16px;margin-right:16px}
  #home-nav{display:none}
  #topbar{position:static;justify-content:center;padding:8px}

<script>
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const CFG_KEY = 'gsearch.settings.v4';
const COOKIE_SETTINGS = 'hyper.settings';
const COOKIE_BG = 'hyper.bg';
const COOKIE_SESSION = 'hyper_session';
const COOKIE_ACCOUNT = 'hyper.account';
const COOKIE_REGION = 'hyper.region';

/* ---------------- cookies (every change persists a real value here) ---------------- */
function setCookie(name, value, days) {
  try {
    let s = name + '=' + encodeURIComponent(String(value)) + ';path=/;SameSite=Lax';
    if (days != null) {
      const d = new Date();
      d.setTime(d.getTime() + days * 864e5);
      s += ';expires=' + d.toUTCString();
    }
    document.cookie = s;
  } catch (e) { /* cookies may be blocked (e.g. some file:// contexts) */ }
}
function getCookie(name) {
  try {
    const re = new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)');
    const m = document.cookie.match(re);
    return m ? decodeURIComponent(m[1]) : null;
  } catch (e) { return null; }
}
function deleteCookie(name) {
  try { document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'; } catch (e) {}
}
/* Login session cookie links the login page to this search page (real token value). */
function makeSessionToken() {
  let s = '';
  try {
    const ab = new Uint8Array(24); crypto.getRandomValues(ab);
    for (const b of ab) s += b.toString(16).padStart(2, '0');
  } catch (e) {
    s = Date.now().toString(16) + Math.random().toString(16).slice(2, 18);
  }
  return 'h-' + s + '-' + Date.now().toString(36);
}

/* Default API key pre-filled so requests always carry auth. Zhipu's API blocks
   the browser CORS preflight, so callAPI falls back through CORS proxies. */
const DEFAULT_API_KEY = '842b6987eac84ccab56eb952a9cb6b3c.GMFznHG6Z8NQdstI';
const GATEWAY_ENDPOINT = 'https://wg.litarcraft.de5.net/api/chat';
const LEGACY_ENDPOINT = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';

const defaults = {
  era: '2025', resultCount: 8, overview: 'short', summaryOn: false,
  endpoint: GATEWAY_ENDPOINT,
  model: 'glm-4-flash',
  apiKey: DEFAULT_API_KEY,
  corsProxy: '',
  seoTitle: 'Hyper',
  seoDescription: 'Hyper — 快速、简洁的 AI 搜索体验，直接给出答案与真实网页结果。',
  seoKeywords: 'Hyper,AI搜索,搜索引擎,智能问答'
};
let settings = Object.assign({}, defaults);
(function loadSettings() {
  let saved = null;
  const ck = getCookie(COOKIE_SETTINGS);
  if (ck) { try { saved = JSON.parse(ck); } catch (e) { saved = null; } }
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) { saved = null; } }
  if (saved && typeof saved === 'object') settings = Object.assign({}, defaults, saved);
  if (!settings.endpoint || settings.endpoint === LEGACY_ENDPOINT) settings.endpoint = GATEWAY_ENDPOINT;
  if (!settings.apiKey) settings.apiKey = DEFAULT_API_KEY;
})();

const state = { query: '', controller: null, runId: 0, startedAt: 0, results: [], related: [], lastSeconds: null };

/* ---------------- helpers ---------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function formatText(src) {
  return String(src).replace(/\r/g, '').split('\n').map((line) => {
    const t = line.replace(/\s+$/, '');
    if (!t) return '<div class="a-gap"></div>';
    const bullet = /^(\s*)(?:[-*•]|\d+[.)])\s+/.exec(t);
    const body = bullet ? t.slice(bullet[0].length) : t;
    return bullet ? '<div class="a-li">' + esc(body) + '</div>' : '<div class="a-p">' + esc(body) + '</div>';
  }).join('');
}
function persist() {
  const json = JSON.stringify(settings);
  setCookie(COOKIE_SETTINGS, json, 365);
  try { localStorage.setItem(CFG_KEY, json); } catch (e) { /* noop */ }
}

/* ---------------- SEO (title / description / keywords, stored in cookie) ---------------- */
function metaEl(attr, name) {
  let el = document.head.querySelector('meta[' + attr + '="' + name + '"]');
  if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
  return el;
}
function applySEO() {
  const title = (settings.seoTitle || 'Hyper').trim() || 'Hyper';
  const desc = (settings.seoDescription || '').trim();
  const kw = (settings.seoKeywords || '').trim();
  metaEl('name', 'description').content = desc;
  metaEl('name', 'keywords').content = kw;
  metaEl('property', 'og:title').content = title;
  metaEl('property', 'og:description').content = desc;
  if ($('#results') && $('#results').hidden) document.title = title;
}

/* ---------------- background (real value stored in cookie hyper.bg) ---------------- */
/* Miuix-style dynamic color: the brand/logo color is derived from the background.
   For a solid color it uses the inverted hue; on images it stays legible via a veil. */
function hexToRgb(hex) {
  let h = String(hex || '').trim().replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

  if (!bg) return '#E60023';
  if (bg.indexOf('color:') === 0) {

    if (c) {

      const inv = { r: 255 - c.r, g: 255 - c.g, b: 255 - c.b };
      const mx = Math.max(inv.r, inv.g, inv.b), mn = Math.min(inv.r, inv.g, inv.b);
      if (mx === mn) return rgbToHex(Math.max(60, inv.r), Math.max(60, inv.g), Math.max(60, inv.b));

      return rgbToHex(inv.r * boost, inv.g * boost, inv.b * boost);

  if (any) return rgbToHex(255 - any.r, 255 - any.g, 255 - any.b);
  return '#E60023';
}

/* ---- instant result cache: repeat queries render locally in <0.1s, no network ---- */
const CACHE_KEY = 'hyper.search.cache.v1';
const CACHE_TTL = 864e5; /* 24h */
function cacheRead(q) {
  try {
    const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    const hit = all[q];
    if (hit && hit.ts && (Date.now() - hit.ts) < CACHE_TTL && hit.results) return hit;
  } catch (e) { /* noop */ }
  return null;
}
function cacheWrite(q, results, related, overview) {
  try {
    const all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    all[q] = { results: results, related: related, overview: overview, ts: Date.now() };
    const keys = Object.keys(all);
    if (keys.length > 100) {
      keys.sort((a, b) => (all[a].ts || 0) - (all[b].ts || 0)).slice(0, keys.length - 100)
        .forEach((k) => { delete all[k]; });
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(all));
  } catch (e) { /* noop */ }
}

/* ---------------- API endpoint resolution ---------------- */
/* Candidates tried in order: user proxy (if any) -> direct GLM -> public proxies.
   Public proxies often strip the Authorization header, so they are a last resort. */
const FALLBACK_PROXIES = [
  'https://api.codetabs.com/v1/proxy/?quest=%s',
  'https://thingproxy.freeboard.io/fetch/%s',
  'https://api.allorigins.win/raw?url=%s'
];
function baseEndpoint() {
  return (settings.endpoint || GATEWAY_ENDPOINT).trim();
}
/* A gateway injects the key server-side and only allows the Content-Type header.
   Sending Content-Type:text/plain with no Authorization header makes this a CORS
   "simple request" — the browser skips the preflight entirely. */
function isGateway() {
  return /\/api\/chat\/?$/.test(baseEndpoint());
}
function buildCandidates() {
  const base = baseEndpoint();
  const enc = encodeURIComponent(base);
  const out = [];
  const cp = (settings.corsProxy || '').trim();
  if (cp) out.push(cp.replace('%s', enc));
  out.push(base);
  FALLBACK_PROXIES.forEach((t) => out.push(t.replace('%s', enc)));
  return out;
}

/* ---------------- API ---------------- */
async function callAPI(body, signal) {
  const candidates = buildCandidates();
  let lastErr = null;
  for (let i = 0; i < candidates.length; i++) {
    const url = candidates[i];
    try {
      const gateway = isGateway() && url.indexOf(baseEndpoint()) === 0;
      const headers = { 'Content-Type': gateway ? 'text/plain' : 'application/json' };
      if (settings.apiKey && !gateway) headers['Authorization'] = 'Bearer ' + settings.apiKey;
      const res = await fetch(url, {
        method: 'POST', headers: headers,
        body: JSON.stringify(body), signal: signal
      });
      if (res.ok) return res;
      let detail = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error && j.error.message) detail = j.error.message; } catch (e) { /* noop */ }
      lastErr = new Error(detail);
      /* a gateway 404 / 405 means "no server deployed here" -> try a proxy next */
    } catch (e) {
      lastErr = e;
    }
  }
  throw enhanceError(lastErr);
}
function enhanceError(e) {
  if (!e) return new Error('未知错误');
  const msg = e.message || String(e);
  if (/Failed to fetch|NetworkError|load failed|TypeError|AbortError/i.test(msg)) {
    return new Error('无法连接 AI 接口（' + msg + '）。' +
      '默认已接入可用的网关，若仍失败：请在左上角设置里填写一个支持转发鉴权头的 CORS 代理（占位符用 %s），' +
      '或改用你自己的兼容接口调用地址。');
  }
  return e;
}

function overviewSystem() {

  return '你撰写展示在网页搜索结果上方的简短概览。直接、准确地用纯文本回答查询。' +
    '使用与查询相同的语言。先用一句直接的句子开头，再给出简短的事实性句子或紧凑的要点列表。' +
    '仅限纯文本：不要 markdown 标题、不要表格、不要 emoji、不要 URL。长度控制在 ' + length + '。' +
    '绝不编造日期、数字或引用。';
}
const RESULTS_SYSTEM =
  '你是一个网页搜索索引。只输出一个原始 JSON 数组，不要任何其它内容——不要 markdown、' +

  '(2) title 不超过 10 个词，snippet 是一句不超过 22 个词的事实性描述，二者均使用与查询相同的语言。' +
  '(3) 逐个输出完整对象，每个对象占一行。(4) 数组前后不要有任何文字。';
const RELATED_SYSTEM =
  '你建议后续的网页搜索。只输出一个原始 JSON 数组，包含 4 个简短的搜索查询字符串，' +

async function streamChat(messages, options, onDelta, signal) {
  const res = await callAPI(Object.assign({ messages: messages, stream: true }, options), signal);
  const ct = (res.headers && res.headers.get && res.headers.get('content-type')) || '';
  if (res.body && ct.indexOf('text/event-stream') !== -1) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '', done = false;
    while (!done) {
      const chunk = await reader.read();
      done = chunk.done;
      if (chunk.value) buffer += decoder.decode(chunk.value, { stream: !done });
      buffer = buffer.replace(/\r\n/g, '\n');
      let cut;
      while ((cut = buffer.indexOf('\n\n')) !== -1) {
        const packet = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        for (const line of packet.split('\n')) {
          if (line.indexOf('data:') !== 0) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          let obj;
          try { obj = JSON.parse(payload); } catch (e) { continue; }
          if (obj.error && obj.error.message) throw new Error(obj.error.message);
          const d = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
          if (d) onDelta(d);
        }
      }
    }
    return;
  }
  /* non-streaming fallback (some proxies buffer and return JSON) */
  const j = await res.json();
  const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  if (text) onDelta(text);
}

function cleanUrl(raw) {
  try {
    const u = new URL(String(raw).trim());
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/i.test(u.hostname)) return null;
    if (/\s/.test(u.href)) return null;
    return u.href;
  } catch (e) { return null; }
}
function normalizeItems(list) {
  const seen = Object.create(null), results = [];
  for (const item of (Array.isArray(list) ? list : [])) {
    if (!item || typeof item !== 'object') continue;
    const url = cleanUrl(item.url);
    if (!url) continue;
    const u = new URL(url);
    const key = u.hostname.replace(/^www\./, '') + u.pathname;
    if (seen[key]) continue;
    seen[key] = 1;
    const title = String(item.title || '').trim().slice(0, 180);
    const snippet = String(item.snippet || '').trim().slice(0, 420);
    if (!title || !snippet) continue;
    results.push({ title: title, url: url, snippet: snippet });
    if (results.length >= Math.max(3, Math.min(10, settings.resultCount))) break;
  }
  return results;
}
function stripFences(t) {
  return String(t || '').replace(/```(?:json)?/gi, '').trim();
}
function extractObjects(str) {
  const out = [];
  const re = /\{[^{}]*\}/g;
  let m;
  while ((m = re.exec(str)) !== null) {
    try {
      const o = JSON.parse(m[0]);
      if (o && typeof o === 'object') out.push(o);
    } catch (e) { /* object is still being streamed */ }
  }
  return out;
}
function isResultObject(o) {
  return o && typeof o.title === 'string' && typeof o.url === 'string' && typeof o.snippet === 'string';
}
function scanItems(text) {
  return extractObjects(stripFences(text)).filter(isResultObject);
}
function parsePayload(text, query) {
  const str = stripFences(text);
  const all = extractObjects(str);
  let obj = null;
  const s = str.indexOf('{'), e = str.lastIndexOf('}');
  if (s !== -1 && e > s) { try { obj = JSON.parse(str.slice(s, e + 1)); } catch (err) { /* not a single object */ } }

  let resultsRaw = (obj && Array.isArray(obj.results)) ? obj.results : [];
  if (!resultsRaw.length) resultsRaw = all.filter(isResultObject);

  let relatedRaw = (obj && Array.isArray(obj.related)) ? obj.related : [];
  if (!relatedRaw.length) {
    relatedRaw = all
      .filter((o) => typeof o.query === 'string' || typeof o.text === 'string')
      .map((o) => o.query || o.text);
  }
  if (!relatedRaw.length) {
    const arrays = str.match(/\[\s*"(?:[^"\\]|\\.)*"\s*(?:,\s*"(?:[^"\\]|\\.)*"\s*)*\]/g) || [];
    for (const a of arrays) {
      try {
        const arr = JSON.parse(a);
        if (Array.isArray(arr) && arr.length > 1 && arr.every((x) => typeof x === 'string')) relatedRaw = arr;
      } catch (err) { /* noop */ }
    }
  }
  const related = relatedRaw
    .map((x) => {
      if (typeof x === 'string') return x;
      if (x && typeof x === 'object') return x.query || x.text || x.title || '';
      return '';
    })
    .filter((x) => x.trim() && x.trim().toLowerCase() !== String(query).toLowerCase())
    .map((x) => x.trim().slice(0, 120)).slice(0, 6);
  return { results: normalizeItems(resultsRaw), related: related };
}
async function streamResults(query, onItems, signal) {
  let buf = '', lastBraces = 0;
  await streamChat([
    { role: 'system', content: RESULTS_SYSTEM }, { role: 'user', content: query }
  ], { temperature: 0.35, max_tokens: 1500 }, (d) => {
    buf += d;
    const braces = (buf.match(/\}/g) || []).length;
    if (braces !== lastBraces) {
      lastBraces = braces;
      const items = scanItems(buf);
      if (items.length) onItems(items, false);
    }
  }, signal);
  const final = parsePayload(buf, query);
  onItems(final.results.length ? final.results : scanItems(buf), true);
}
async function fetchRelated(query, signal) {
  const res = await callAPI({
    model: settings.model,
    messages: [{ role: 'system', content: RELATED_SYSTEM }, { role: 'user', content: query }],
    stream: false, temperature: 0.4, max_tokens: 200
  }, signal);
  const j = await res.json();
  const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  const str = stripFences(text);
  let arr = [];
  const s = str.indexOf('['), e = str.lastIndexOf(']');
  if (s !== -1 && e > s) { try { arr = JSON.parse(str.slice(s, e + 1)); } catch (err) { /* noop */ } }
  if (!Array.isArray(arr) || !arr.length) arr = extractObjects(str).map((o) => o.query || o.text || '');
  return arr
    .map((x) => typeof x === 'string' ? x : (x && typeof x === 'object' ? (x.query || x.text || '') : ''))
    .filter((x) => x.trim() && x.trim().toLowerCase() !== String(query).toLowerCase())
    .map((x) => x.trim().slice(0, 120)).slice(0, 6);
}

/* ---------------- rendering ---------------- */
function siteInfo(url) {
  let host = '', crumb = '';
  try {
    const u = new URL(url);
    host = u.hostname.replace(/^www\./, '');
    let parts = [];
    try { parts = decodeURIComponent(u.pathname).split('/').filter(Boolean).slice(0, 2); }
    catch (e) { parts = u.pathname.split('/').filter(Boolean).slice(0, 2); }
    crumb = host + (parts.length ? ' \u203a ' + parts.join(' \u203a ') : '');
  } catch (e) { host = 'web'; crumb = url; }
  const skipSub = /^(www|en|m|mobile|docs|developer|dev|blog|news|support|help|api|mail|ftp|static|cdn|shop|store|wiki|login|my|www2)$/i;
  const labels = host.split('.');
  while (labels.length > 2 && skipSub.test(labels[0])) labels.shift();
  const name = labels[0].replace(/[-_]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
  let h = 0;
  for (const c of host) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue = h % 360;
  return { name: name, crumb: crumb, host: host, letter: (name[0] || 'W').toUpperCase(),
    bg: 'hsl(' + hue + ',48%,93%)', fg: 'hsl(' + hue + ',45%,32%)' };
}
function renderResults(items) {

    return;
  }
  $('#results-list').innerHTML = items.map((r) => {
    const s = siteInfo(r.url);
    return '<div class="hit">' +
      '<div class="hit-site"><span class="favicon" style="background:' + s.bg + ';color:' + s.fg + '">' + esc(s.letter) +
        '<img class="fav-img" alt="" data-host="' + esc(s.host) + '" src="https://favicon.im/' + esc(s.host) + '?larger=true"></span>' +
      '<span class="site-meta"><span class="site-name">' + esc(s.name) + '</span>' +
      '<span class="site-url">' + esc(s.crumb) + '</span></span></div>' +
      '<a class="hit-title" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title) + '</a>' +
      '<div class="hit-url-classic">' + esc(r.url) + '</div>' +

  }).join('');
  $$('.fav-img', $('#results-list')).forEach((img) => {

    img.addEventListener('error', function () {

    });

}
function renderRelated(items) {

function renderStat(count, seconds) {

/* ---------------- search flow ---------------- */
async function runSearch(q) {
  q = String(q || '').trim().slice(0, 500);
  if (!q) { showHome(); return; }

  if (state.controller) { try { state.controller.abort(); } catch (e) { /* noop */ } }
  const controller = new AbortController();
  state.controller = controller;
  const runId = ++state.runId;
  const isCurrent = () => runId === state.runId && !controller.signal.aborted;

  state.query = q; state.results = []; state.related = []; state.lastSeconds = null;
  state.startedAt = performance.now();

  const wantSummary = settings.summaryOn === true;
  /* Instant path: a cached answer renders synchronously with zero network. */
  const cached = cacheRead(q);
  if (cached) {
    showResults(q);
    $('#overview-body').innerHTML = (wantSummary && cached.overview) ? formatText(cached.overview) : '';
    state.results = cached.results || [];
    state.related = cached.related || [];
    renderResults(state.results);
    renderRelated(state.related);
    state.lastSeconds = '0.00';
    renderStat(state.results.length, '0.00');
    return;
  }

  showResults(q);
  $('#stat').textContent = '正在检索索引……';
  $('#overview-body').innerHTML = wantSummary
    ? '<div class="loading">正在汇总结果<span id="dots"></span> <span class="caret"></span></div>' : '';
  $('#results-list').innerHTML = '';
  $('#related').hidden = true;
  let dotTick = 0;
  const dotTimer = setInterval(() => {
    if (!isCurrent()) { clearInterval(dotTimer); return; }
    const d = $('#dots'); if (d) d.textContent = '.'.repeat((dotTick++ % 3) + 1);
  }, 350);

  let raw = '', paintPending = false;
  const paint = () => {
    paintPending = false;
    if (!isCurrent()) return;
    $('#overview-body').innerHTML = formatText(raw) + '<span class="caret"></span>';
  };
  const schedulePaint = () => { if (!paintPending) { paintPending = true; requestAnimationFrame(paint); } };

  let overviewErr = null, resultsErr = null;

  const p1 = wantSummary ? streamChat([
    { role: 'system', content: overviewSystem() }, { role: 'user', content: q }
  ], { temperature: 0.7, max_tokens: settings.overview === 'detailed' ? 700 : 400 }, (delta) => {
    if (!isCurrent()) return;
    if (!raw) $('#overview-body').innerHTML = '';
    raw += delta; schedulePaint();
  }, controller.signal).then(() => {
    if (!isCurrent()) return;
    $('#overview-body').innerHTML = raw.trim() ? formatText(raw) : '<div class="a-p">暂无摘要。</div>';
  }).catch((e) => { if (isCurrent()) overviewErr = e; }) : Promise.resolve();

  const p2 = streamResults(q, (items, done) => {
    if (!isCurrent()) return;
    const list = normalizeItems(items);
    if (list.length !== state.results.length || done) {
      state.results = list;
      renderResults(list);
    }
  }, controller.signal).catch((e) => { if (isCurrent()) resultsErr = e; });

  const p3 = fetchRelated(q, controller.signal).then((list) => {
    if (!isCurrent()) return;
    state.related = list; renderRelated(list);
  }).catch(() => { /* suggestions are optional */ });

  /* Only the overview + results gate the timer; related chips finish in background. */
  await Promise.all([p1, p2]);
  clearInterval(dotTimer);
  if (!isCurrent()) return;

  const seconds = ((performance.now() - state.startedAt) / 1000).toFixed(2);
  state.lastSeconds = seconds;
  renderStat(state.results.length, seconds);
  if (state.results.length && !overviewErr && !resultsErr) {
    cacheWrite(q, state.results, state.related, $('#overview-body').textContent.trim());
  }

  if (overviewErr && resultsErr && !state.results.length) {
    showError(overviewErr.message || String(overviewErr), '#overview-body');
    $('#results-list').innerHTML = '';
  } else if (resultsErr && !state.results.length) {
    showError(resultsErr.message || String(resultsErr), '#results-list');
  } else if (overviewErr) {
    showError(overviewErr.message || String(overviewErr), '#overview-body');
  }
}

/* ---------------- custom animated dropdown ---------------- */
function createDropdown(options, currentValue, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'dd';
  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'dd-trigger';
  trigger.setAttribute('aria-haspopup', 'listbox');
  trigger.setAttribute('aria-expanded', 'false');
  const val = document.createElement('span');
  val.className = 'dd-value';
  const cur = options.filter(function (o) { return o.value === currentValue; })[0] || options[0];
  val.textContent = cur ? cur.label : '';
  const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrow.setAttribute('class', 'dd-arrow icon');
  arrow.setAttribute('viewBox', '0 0 24 24');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#i-chevron');
  arrow.appendChild(use);
  trigger.appendChild(val); trigger.appendChild(arrow);

  const menu = document.createElement('div');
  menu.className = 'dd-menu';
  menu.setAttribute('role', 'listbox');
  (options || []).forEach(function (o, i) {
    const item = document.createElement('div');
    item.className = 'dd-item' + (o.value === currentValue ? ' selected' : '');
    item.setAttribute('role', 'option');
    item.textContent = o.label;
    item.style.transitionDelay = (i * 28) + 'ms';
    item.addEventListener('click', function () {
      val.textContent = o.label;
      menu.querySelectorAll('.dd-item').forEach(function (x) { x.classList.remove('selected'); });
      item.classList.add('selected');
      close();
      if (typeof onSelect === 'function') onSelect(o.value);
    });
    menu.appendChild(item);
  });
  wrap.appendChild(trigger); wrap.appendChild(menu);

  function outside(e) { if (!wrap.contains(e.target)) close(); }
  function close() { wrap.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); document.removeEventListener('click', outside); }
  function open() { wrap.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); document.addEventListener('click', outside); }
  trigger.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    if (wrap.classList.contains('open')) close(); else open();
  });
  return wrap;
}

  const input = visibleInput(); if (!input) return;
  let rec; try { rec = new SR(); } catch (e) { toast('语音输入无法启动。'); return; }
  rec.lang = navigator.language || 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 1;
  el.classList.add('listening'); toast('正在聆听……请说话。');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript; input.value = text;
    if (text.trim()) submitQuery(text);
  };
  rec.onerror = (e) => toast('语音输入：' + (e.error || '失败'));
  rec.onend = () => el.classList.remove('listening');
  try { rec.start(); } catch (e) { el.classList.remove('listening'); toast('语音输入无法启动。'); }
}
function stripScope(q) {
  let base = String(q || '').trim();
  Object.keys(SCOPES).forEach((k) => {
    const p = SCOPES[k]; if (p && base.toLowerCase().indexOf(p) === 0) base = base.slice(p.length);
  });
  return base;
}
function applyScope(scope, fromTab) {
  if (!state.query) { toast('请先输入查询，再选择分类。'); const b = visibleInput(); if (b) b.focus(); return; }
  const q = (SCOPES[scope] || '') + stripScope(state.query);
  submitQuery(q);
}
function openMore() {
  const item = (scope, label) => '<button type="button" data-action="scope" data-scope="' + scope + '">' + label + '</button>';
  openPanel('更多搜索类型', '<p class="panel-p">选择一项将以该焦点重新运行当前查询。</p>' +
    '<div class="app-grid">' + item('books', '书籍') + item('scholar', '学术') +
    item('maps', '地图') + item('shopping', '购物') + item('news', '新闻') + item('all', '全部网页') + '</div>');
}
function openTools() {
  const countOpts = [3, 4, 5, 6, 7, 8, 9, 10].map((n) => ({ value: String(n), label: String(n) }));
  const ovOpts = [
    { value: 'short', label: '简短' },
    { value: 'detailed', label: '详细' }
  ];
  openPanel('搜索工具', '<p class="panel-p">这些设置保存在本浏览器（Cookie），并应用于下一次搜索。</p>' +
    '<div class="panel-row"><label>结果 <div id="tool-count-host" class="dd-host"></div></label>' +
    '<label>概览 <div id="tool-overview-host" class="dd-host"></div></label>' +
    '<button type="button" data-action="save-tools">保存并重搜</button></div>');
  $('#tool-count-host').appendChild(createDropdown(countOpts, String(settings.resultCount), null));
  $('#tool-overview-host').appendChild(createDropdown(ovOpts, settings.overview, null));
}
function saveTools() {
  const cv = ($('#tool-count-host') && $('#tool-count-host .dd-value')) ? $('#tool-count-host .dd-value').textContent : '';
  const ov = ($('#tool-overview-host') && $('#tool-overview-host .dd-value')) ? $('#tool-overview-host .dd-value').textContent : '简短';
  settings.resultCount = Number(cv) || 8;
  settings.overview = ov === '详细' ? 'detailed' : 'short';
  persist(); closeModal();
  if (state.query) submitQuery(state.query); else toast('搜索工具已保存。');
}
function handleAction(action, el) {
  switch (action) {
    case 'close': closeModal(); break;
    case 'settings': openSettings(); break;
    case 'help': openHelp(); break;
    case 'home': closeModal(); location.hash = ''; break;
    case 'info': openInfo(el.getAttribute('data-topic')); break;
    case 'apps': openApps(); break;
    case 'account': openAccount(); break;
    case 'save-account': saveAccount(); break;
    case 'region': openRegion(); break;
    case 'save-region': saveRegion(); break;
    case 'lens': openLens(); break;
    case 'lens-name': {
      const f = $('#lens-file') && $('#lens-file').files[0];
      if (!f) { toast('请先选择一张图片。'); break; }
      const name = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
      closeModal(); if (name) submitQuery(name); else toast('文件名为空。');
      break;
    }
    case 'voice': startVoice(el); break;
    case 'focus': { const b = visibleInput(); if (b) b.focus(); break; }
    case 'submit': { const b = visibleInput(); const v = b ? b.value.trim() : ''; if (!v) toast('请输入内容后再搜索。'); submitQuery(v); break; }
    case 'tab': applyScope(el.getAttribute('data-scope'), true); break;
    case 'scope': closeModal(); applyScope(el.getAttribute('data-scope'), false); break;
    case 'more': openMore(); break;
    case 'tools': openTools(); break;
    case 'save-tools': saveTools(); break;
    case 'era': setEra(el.getAttribute('data-era')); closeModal(); break;
    case 'login': closeModal(); location.href = 'login.html'; break;
    case 'logout': logout(); break;
    default: break;
  }
}
function logout() {
  deleteCookie(COOKIE_SESSION);
  try { localStorage.removeItem('hyper.session'); } catch (e) {}
  closeModal(); paintAccount(); showHome();
}
/* ---------------- events ---------------- */
$('#home-form').addEventListener('submit', (e) => { e.preventDefault(); submitQuery($('#home-input').value); });
$('#res-form').addEventListener('submit', (e) => { e.preventDefault(); submitQuery($('#res-input').value); });
$('#res-prefs').addEventListener('click', (e) => { e.preventDefault(); openSettings(); });
$('#res-settings').addEventListener('click', (e) => { e.preventDefault(); openSettings(); });
$('#res-help').addEventListener('click', (e) => { e.preventDefault(); openHelp(); });
$('#modal-backdrop').addEventListener('click', (e) => { if (e.target === $('#modal-backdrop')) closeModal(); });
document.addEventListener('click', (e) => {
  const link = e.target.closest('a[data-q]');
  if (!link) return;
  e.preventDefault(); submitQuery(link.getAttribute('data-q'));
});
document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  handleAction(el.getAttribute('data-action'), el);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(document.activeElement.tagName)) {
    const el = document.activeElement.closest && document.activeElement.closest('[data-action]');
    if (el) { e.preventDefault(); handleAction(el.getAttribute('data-action'), el); return; }
  }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    const box = visibleInput();
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  }
});
window.addEventListener('hashchange', () => {
  const q = readHashQuery();
  if (q) runSearch(q);
  else { if (state.controller) state.controller.abort(); state.query = ''; showHome(); }
});

/* ---------------- boot ---------------- */
loadBackground();                 // apply custom background stored in cookie
applySEO();                       // apply saved SEO meta / title
applySummary();                   // summary is opt-in, hidden by default
wireA11y(); paintAccount(); paintRegion();

/* Login is optional (sign-in-when-you-want, like Google). The session cookie is
   read only to personalize the avatar; the search page is fully usable without it. */
function getSession() {
  try { return getCookie(COOKIE_SESSION) || localStorage.getItem('hyper.session') || ''; } catch (e) { return getCookie(COOKIE_SESSION) || ''; }
}
const eraParam = new URLSearchParams(location.search).get('era');
setEra(['2025', '1998', '1993'].indexOf(eraParam) !== -1 ? eraParam : settings.era);
const initialQuery = readHashQuery();
if (initialQuery) runSearch(initialQuery);
else showHome();
</script>
</body>
